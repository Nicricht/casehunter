name: Gmail Connection Verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gmail-verify.yml'

permissions:
  contents: read

jobs:
  verify-gmail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CASE_HUNTER_GMAIL_USERNAME: ${{ secrets.CASE_HUNTER_GMAIL_USERNAME }}
      CASE_HUNTER_GMAIL_APP_PASSWORD: ${{ secrets.CASE_HUNTER_GMAIL_APP_PASSWORD }}
    steps:
      - name: Verify Gmail SMTP and IMAP authentication
        shell: bash
        run: |
          python - <<'PY'
          import imaplib
          import os
          import smtplib

          username = os.getenv('CASE_HUNTER_GMAIL_USERNAME', '').strip()
          password = os.getenv('CASE_HUNTER_GMAIL_APP_PASSWORD', '').strip()
          if not username or not password:
              raise SystemExit('GMAIL_SECRETS_MISSING')

          with smtplib.SMTP_SSL('smtp.gmail.com', 465, timeout=20) as smtp:
              smtp.login(username, password)
          print('SMTP_LOGIN_OK')

          imap = imaplib.IMAP4_SSL('imap.gmail.com', 993, timeout=20)
          try:
              imap.login(username, password)
          finally:
              try:
                  imap.logout()
              except Exception:
                  pass
          print('IMAP_LOGIN_OK')
          PY
