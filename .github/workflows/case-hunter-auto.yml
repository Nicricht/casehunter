name: Case Hunter Auto Cloud

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case-hunter-auto.yml'
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: case-hunter-auto-cloud-v3
  cancel-in-progress: true

permissions:
  contents: read

env:
  CASE_HUNTER_AUTO_SEND_APPROVED: '1'
  CASE_HUNTER_AUTO_POLICY_SEND: '1'
  CASE_HUNTER_AUTO_SEND_MIN_PRIORITY: '70'
  CASE_HUNTER_AUTO_MAX_FIRST_CONTACTS_PER_DAY: '10'
  CASE_HUNTER_AUTO_CONTACT_DISCOVERY: '1'
  CASE_HUNTER_AUTO_MONITOR_REPLIES: '1'
  CASE_HUNTER_AUTO_SEND_FOLLOWUPS: '1'
  CASE_HUNTER_AUTO_FOLLOWUP_DAYS: '5'
  CASE_HUNTER_STORE_REPLY_CONTENT: '0'
  CASE_HUNTER_AUTO_MIN_PRIORITY: '20'
  CASE_HUNTER_AUTO_MAX_PAGES: '5'
  CASE_HUNTER_AUTO_ENRICH_LIMIT: '15'
  CASE_HUNTER_AUTO_SUBJECTS_PER_CYCLE: '8'
  CASE_HUNTER_AUTO_INDEX_PAGES: '4'
  CASE_HUNTER_AUTO_CASES_PER_CYCLE: '8'
  CASE_HUNTER_CONTACT_TIMEOUT: '8'
  CASE_HUNTER_CONTACT_MAX_SITES: '2'
  CASE_HUNTER_AUTO_INTERVAL_MINUTES: '360'
  CASE_HUNTER_DATA_DIR: ${{ github.workspace }}/data

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Case Hunter
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore Case Hunter state
        uses: actions/cache@v4
        with:
          path: data
          key: case-hunter-state-v3-${{ github.run_id }}
          restore-keys: |
            case-hunter-state-v3-
            case-hunter-state-v2-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Case Hunter before hunting
        run: python -m casehunter verify

      - name: Run automatic hunting and follow-up cycle
        env:
          CASE_HUNTER_SMTP_USERNAME: ${{ secrets.CASE_HUNTER_GMAIL_USERNAME }}
          CASE_HUNTER_SMTP_PASSWORD: ${{ secrets.CASE_HUNTER_GMAIL_APP_PASSWORD }}
          CASE_HUNTER_IMAP_USERNAME: ${{ secrets.CASE_HUNTER_GMAIL_USERNAME }}
          CASE_HUNTER_IMAP_PASSWORD: ${{ secrets.CASE_HUNTER_GMAIL_APP_PASSWORD }}
        run: |
          mkdir -p data
          python -m casehunter auto | tee data/last-auto-run.json

      - name: Build cloud summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import sqlite3
          from pathlib import Path

          db = Path('data/case_hunter.db')
          print('# Case Hunter Auto Cloud')
          print('')
          if not db.exists():
              print('No database was produced in this run.')
              raise SystemExit(0)
          conn = sqlite3.connect(db)
          conn.row_factory = sqlite3.Row
          try:
              last = conn.execute('SELECT * FROM automation_runs ORDER BY id DESC LIMIT 1').fetchone()
              if last:
                  print(f"**Run:** {last['id']}  ")
                  print(f"**Status:** {last['status']}  ")
                  print(f"**Cases created:** {last['cases_created']}  ")
                  print(f"**Cases updated:** {last['cases_updated']}  ")
                  print(f"**Contacts found:** {last['contacts_found']}  ")
                  print(f"**Drafts created:** {last['drafts_created']}  ")
                  print(f"**Messages sent:** {last['messages_sent']}  ")
                  if last['error']:
                      print(f"**Error:** {last['error']}  ")
              replies = conn.execute('SELECT COUNT(*) n FROM outreach_replies').fetchone()['n']
              due = conn.execute("SELECT COUNT(*) n FROM followups WHERE status='DUE'").fetchone()['n']
              print(f"**Replies classified:** {replies}  ")
              print(f"**Follow-ups due:** {due}  ")
              run_json = Path('data/last-auto-run.json')
              if run_json.exists():
                  try:
                      payload = json.loads(run_json.read_text(encoding='utf-8'))
                      policy = payload.get('policy_auto_send') or {}
                      print(f"**Policy auto-send enabled:** {policy.get('enabled', False)}  ")
                      print(f"**Policy auto-approved:** {policy.get('auto_approved', 0)}  ")
                      print(f"**Policy auto-sent:** {policy.get('auto_sent', 0)}  ")
                      print(f"**Daily first-contact limit:** {policy.get('daily_limit', 0)}  ")
                  except Exception:
                      pass
              print('')
              print('## Top outreach queue')
              rows = conn.execute('''
                  SELECT o.status, o.recipient_email,
                         c.detected_company_name, c.contract_ref, c.financial_priority
                  FROM outreach_messages o
                  JOIN cases c ON c.id=o.case_id
                  WHERE o.status IN ('READY_FOR_APPROVAL','NEEDS_CONTACT','APPROVED')
                  ORDER BY c.financial_priority DESC, o.id DESC
                  LIMIT 20
              ''').fetchall()
              if not rows:
                  print('No pending prospects in the queue yet.')
              else:
                  print('| Priority | Company | Contract | Status | Contact |')
                  print('|---:|---|---|---|---|')
                  for row in rows:
                      company = (row['detected_company_name'] or '').replace('|', '/')
                      contract = (row['contract_ref'] or '').replace('|', '/')
                      contact = row['recipient_email'] or 'pending'
                      print(f"| {row['financial_priority']} | {company} | {contract} | {row['status']} | {contact} |")
          finally:
              conn.close()
          PY

      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: case-hunter-run-summary-${{ github.run_number }}
          path: data/last-auto-run.json
          if-no-files-found: warn
          retention-days: 14
