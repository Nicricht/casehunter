name: Case Hunter Auto Cloud

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case-hunter-auto.yml'
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: case-hunter-auto-cloud-v3
  cancel-in-progress: true

permissions:
  contents: read

env:
  CASE_HUNTER_DATABASE_URL: ${{ secrets.CASE_HUNTER_DATABASE_URL }}
  CASE_HUNTER_AUTO_SEND_APPROVED: '1'
  CASE_HUNTER_AUTO_POLICY_SEND: '1'
  CASE_HUNTER_AUTO_SEND_MIN_PRIORITY: '70'
  CASE_HUNTER_AUTO_MAX_FIRST_CONTACTS_PER_DAY: '10'
  CASE_HUNTER_AUTO_CONTACT_DISCOVERY: '1'
  CASE_HUNTER_AUTO_MONITOR_REPLIES: '1'
  CASE_HUNTER_AUTO_SEND_FOLLOWUPS: '1'
  CASE_HUNTER_AUTO_FOLLOWUP_DAYS: '5'
  CASE_HUNTER_STORE_REPLY_CONTENT: '0'
  CASE_HUNTER_AUTO_MIN_PRIORITY: '20'
  CASE_HUNTER_AUTO_MAX_PAGES: '5'
  CASE_HUNTER_AUTO_ENRICH_LIMIT: '15'
  CASE_HUNTER_AUTO_SUBJECTS_PER_CYCLE: '8'
  CASE_HUNTER_AUTO_INDEX_PAGES: '4'
  CASE_HUNTER_AUTO_CASES_PER_CYCLE: '8'
  CASE_HUNTER_CONTACT_TIMEOUT: '8'
  CASE_HUNTER_CONTACT_MAX_SITES: '2'
  CASE_HUNTER_AUTO_INTERVAL_MINUTES: '360'
  CASE_HUNTER_DATA_DIR: ${{ github.workspace }}/data

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Case Hunter
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore SQLite state
        if: ${{ env.CASE_HUNTER_DATABASE_URL == '' }}
        uses: actions/cache@v4
        with:
          path: data
          key: case-hunter-state-v3-${{ github.run_id }}
          restore-keys: |
            case-hunter-state-v3-
            case-hunter-state-v2-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Case Hunter before hunting
        env:
          CASE_HUNTER_DATABASE_URL: ''
          DATABASE_URL: ''
        run: python -m casehunter verify

      - name: Send requested business replies through Gmail SMTP
        if: ${{ github.event_name == 'push' }}
        env:
          GMAIL_USERNAME: ${{ secrets.CASE_HUNTER_GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.CASE_HUNTER_GMAIL_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import imaplib
          import os
          import re
          import smtplib
          from email.message import EmailMessage
          from email.utils import formataddr, make_msgid

          username = os.environ['GMAIL_USERNAME'].strip()
          password = os.environ['GMAIL_APP_PASSWORD'].strip()

          def find_sent_box(imap):
              status, boxes = imap.list()
              if status != 'OK':
                  return None
              for raw in boxes or []:
                  text = raw.decode('utf-8', errors='replace')
                  if '\\Sent' in text:
                      quoted = re.findall(r'"([^"]+)"', text)
                      if quoted:
                          return quoted[-1]
              return None

          def already_sent(marker):
              with imaplib.IMAP4_SSL('imap.gmail.com', 993) as imap:
                  imap.login(username, password)
                  box = find_sent_box(imap)
                  if not box:
                      return False
                  status, _ = imap.select('"' + box + '"', readonly=True)
                  if status != 'OK':
                      return False
                  status, data = imap.search(None, 'HEADER', 'X-Case-Hunter-Reply', '"' + marker + '"')
                  return status == 'OK' and bool(data and data[0].strip())

          def send(marker, to, subject, body, cc=None):
              if already_sent(marker):
                  print('SKIP_ALREADY_SENT', marker)
                  return
              msg = EmailMessage()
              msg['From'] = formataddr(('Nicolás Vega', username))
              msg['To'] = to
              if cc:
                  msg['Cc'] = cc
              msg['Subject'] = subject
              msg['Message-ID'] = make_msgid()
              msg['X-Case-Hunter-Reply'] = marker
              msg.set_content(body)
              recipients = [to] + ([cc] if cc else [])
              with smtplib.SMTP_SSL('smtp.gmail.com', 465, timeout=30) as smtp:
                  smtp.login(username, password)
                  smtp.send_message(msg, from_addr=username, to_addrs=recipients)
              print('SENT', marker, to)

          send(
              'hmv-20260911-v1',
              'julio@jmarinpropiedades.cl',
              'Re: Antecedentes públicos sobre pagos del proyecto Plaza Domingo Espiñeira',
              '''Hola Julio,

Gracias por responder. Estudio Ingeniería Informática y estoy desarrollando de forma independiente Case Hunter, una herramienta para detectar y ordenar antecedentes públicos relacionados con contratos, pagos y cierres administrativos con organismos públicos.

La idea es identificar casos que todavía pueden requerir seguimiento, ordenar la cronología y señalar cuál parece ser la siguiente gestión útil. No represento a la municipalidad ni a una empresa de cobranza.

En el caso de HMV encontré antecedentes públicos suficientes para preparar una síntesis breve del proyecto Plaza Domingo Espiñeira y del estado de los pagos que aparecen en esos registros.

Si te parece, te la envío por este mismo medio.

Saludos,
Nicolás Vega''',
              cc='contacto@chmv.cl'
          )

          send(
              'alembic-20260911-v1',
              'cobranzachile@alembic.co.in',
              'Re: Antecedente público sobre deuda y despachos',
              '''Estimados,

Gracias por responder. Les comparto la síntesis del antecedente público que encontré.

Fuente: Registro de Audiencias de la Ley del Lobby, identificador MU271AW2265687, audiencia del 28 de julio de 2026.

En el registro se consigna una reunión vinculada a Alembic Pharmaceuticals por regularización de deuda vencida. El antecedente señala que, según el registro del área contable, se reconocía una deuda de arrastre por $5.178.271. También indica que el municipio se encontraba bloqueado para nuevos despachos desde diciembre de 2025 y que el Director Comunal de Salud enviaría el detalle de la deuda a la administración municipal para solicitar recursos destinados al pago.

Fuente pública:
https://www.leylobby.gob.cl/instituciones/MU271/audiencias/2026/800758/936913

Esto refleja únicamente lo publicado en ese registro y no permite confirmar por sí solo el estado actual del pago. Si el asunto sigue pendiente, puedo ordenar los hitos posteriores y revisar qué gestión pública aparece como siguiente paso.

¿Sigue pendiente actualmente o ya fue regularizado?

Saludos,
Nicolás Vega'''
          )
          PY

      - name: Run automatic hunting and follow-up cycle
        env:
          CASE_HUNTER_SMTP_USERNAME: ${{ secrets.CASE_HUNTER_GMAIL_USERNAME }}
          CASE_HUNTER_SMTP_PASSWORD: ${{ secrets.CASE_HUNTER_GMAIL_APP_PASSWORD }}
          CASE_HUNTER_IMAP_USERNAME: ${{ secrets.CASE_HUNTER_GMAIL_USERNAME }}
          CASE_HUNTER_IMAP_PASSWORD: ${{ secrets.CASE_HUNTER_GMAIL_APP_PASSWORD }}
        run: |
          mkdir -p data
          python -m casehunter auto | tee data/last-auto-run.json

      - name: Build backend-independent cloud summary
        if: always()
        run: python -m casehunter.cloud_summary >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: case-hunter-run-summary-${{ github.run_number }}
          path: data/last-auto-run.json
          if-no-files-found: warn
          retention-days: 14
