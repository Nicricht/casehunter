name: Case Hunter Auto Cloud

# Railway worker + PostgreSQL are the production source of truth.
# This workflow remains manual-only for controlled diagnostics and must never
# fall back to an independent SQLite state.
on:
  workflow_dispatch:

concurrency:
  group: case-hunter-auto-cloud-v3
  cancel-in-progress: true

permissions:
  contents: read

env:
  CASE_HUNTER_DATABASE_URL: ${{ secrets.CASE_HUNTER_DATABASE_URL }}
  CASE_HUNTER_AUTO_SEND_APPROVED: '0'
  CASE_HUNTER_AUTO_POLICY_SEND: '0'
  CASE_HUNTER_AUTO_SEND_MIN_PRIORITY: '70'
  CASE_HUNTER_AUTO_MAX_FIRST_CONTACTS_PER_DAY: '10'
  CASE_HUNTER_AUTO_CONTACT_DISCOVERY: '1'
  CASE_HUNTER_AUTO_MONITOR_REPLIES: '1'
  CASE_HUNTER_AUTO_SEND_FOLLOWUPS: '0'
  CASE_HUNTER_AUTO_FOLLOWUP_DAYS: '5'
  CASE_HUNTER_STORE_REPLY_CONTENT: '0'
  CASE_HUNTER_AUTO_MIN_PRIORITY: '20'
  CASE_HUNTER_AUTO_MAX_PAGES: '5'
  CASE_HUNTER_AUTO_ENRICH_LIMIT: '15'
  CASE_HUNTER_AUTO_SUBJECTS_PER_CYCLE: '8'
  CASE_HUNTER_AUTO_INDEX_PAGES: '4'
  CASE_HUNTER_AUTO_CASES_PER_CYCLE: '8'
  CASE_HUNTER_CONTACT_TIMEOUT: '8'
  CASE_HUNTER_CONTACT_MAX_SITES: '2'
  CASE_HUNTER_AUTO_INTERVAL_MINUTES: '360'
  CASE_HUNTER_OCR_LANG: 'spa+eng'

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Case Hunter
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Require production PostgreSQL
        shell: bash
        run: |
          if [ -z "$CASE_HUNTER_DATABASE_URL" ]; then
            echo "CASE_HUNTER_DATABASE_URL is required. SQLite fallback is intentionally disabled."
            exit 1
          fi

      - name: Install OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Case Hunter before hunting
        # The test suite stays isolated from production even when the workflow
        # is manually dispatched with the production PostgreSQL secret.
        env:
          CASE_HUNTER_DATABASE_URL: ''
          DATABASE_URL: ''
          MERCADO_PUBLICO_TICKET: ''
        run: python -m casehunter verify

      - name: Run manual diagnostic hunting cycle
        env:
          CASE_HUNTER_SMTP_USERNAME: ${{ secrets.CASE_HUNTER_GMAIL_USERNAME }}
          CASE_HUNTER_SMTP_PASSWORD: ${{ secrets.CASE_HUNTER_GMAIL_APP_PASSWORD }}
          CASE_HUNTER_IMAP_USERNAME: ${{ secrets.CASE_HUNTER_GMAIL_USERNAME }}
          CASE_HUNTER_IMAP_PASSWORD: ${{ secrets.CASE_HUNTER_GMAIL_APP_PASSWORD }}
          MERCADO_PUBLICO_TICKET: ${{ secrets.MERCADO_PUBLICO_TICKET }}
        run: |
          mkdir -p data
          python -m casehunter auto | tee data/last-auto-run.json

      - name: Build backend-independent cloud summary
        if: always()
        run: python -m casehunter.cloud_summary >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: case-hunter-run-summary-${{ github.run_number }}
          path: data/last-auto-run.json
          if-no-files-found: warn
          retention-days: 14
