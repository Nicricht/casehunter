name: Migrate Case Hunter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-casehunter.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout official Case Hunter repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch Case Hunter from old repository
        run: |
          git clone --depth 1 --branch case-hunter-resolve https://github.com/Nicricht/cambia-tu-mente-app.git /tmp/casehunter-source
          test -f /tmp/casehunter-source/case-hunter-resolve/requirements.txt
          test -d /tmp/casehunter-source/case-hunter-resolve/casehunter
          test -d /tmp/casehunter-source/case-hunter-resolve/tests

      - name: Copy complete Case Hunter project into official repository
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            /tmp/casehunter-source/case-hunter-resolve/ ./

      - name: Install official cloud scheduler
        run: |
          mkdir -p .github/workflows
          cat > .github/workflows/case-hunter-auto.yml <<'YAML'
          name: Case Hunter Auto Cloud

          on:
            workflow_dispatch:
            schedule:
              - cron: '17 */6 * * *'
            push:
              branches: [main]
              paths:
                - '.github/workflows/case-hunter-auto.yml'

          concurrency:
            group: case-hunter-auto-cloud-v2
            cancel-in-progress: true

          permissions:
            contents: read

          env:
            CASE_HUNTER_AUTO_SEND_APPROVED: '0'
            CASE_HUNTER_AUTO_CONTACT_DISCOVERY: '1'
            CASE_HUNTER_AUTO_MIN_PRIORITY: '20'
            CASE_HUNTER_AUTO_MAX_PAGES: '5'
            CASE_HUNTER_AUTO_ENRICH_LIMIT: '15'
            CASE_HUNTER_AUTO_SUBJECTS_PER_CYCLE: '8'
            CASE_HUNTER_AUTO_INDEX_PAGES: '4'
            CASE_HUNTER_AUTO_CASES_PER_CYCLE: '8'
            CASE_HUNTER_CONTACT_TIMEOUT: '8'
            CASE_HUNTER_CONTACT_MAX_SITES: '2'
            CASE_HUNTER_AUTO_INTERVAL_MINUTES: '360'
            CASE_HUNTER_DATA_DIR: ${{ github.workspace }}/data

          jobs:
            hunt:
              runs-on: ubuntu-latest
              timeout-minutes: 20
              steps:
                - name: Checkout Case Hunter
                  uses: actions/checkout@v4

                - name: Setup Python
                  uses: actions/setup-python@v5
                  with:
                    python-version: '3.11'
                    cache: pip
                    cache-dependency-path: requirements.txt

                - name: Restore Case Hunter state
                  uses: actions/cache@v4
                  with:
                    path: data
                    key: case-hunter-state-v2-${{ github.run_id }}
                    restore-keys: |
                      case-hunter-state-v2-

                - name: Install dependencies
                  run: |
                    python -m pip install --upgrade pip
                    python -m pip install -r requirements.txt

                - name: Run automatic hunting cycle
                  run: |
                    mkdir -p data
                    python -m casehunter auto | tee data/last-auto-run.json

                - name: Build cloud summary
                  if: always()
                  run: |
                    python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
                    import sqlite3
                    from pathlib import Path

                    db = Path('data/case_hunter.db')
                    print('# Case Hunter Auto Cloud')
                    print('')
                    if not db.exists():
                        print('No database was produced in this run.')
                        raise SystemExit(0)
                    conn = sqlite3.connect(db)
                    conn.row_factory = sqlite3.Row
                    try:
                        last = conn.execute('SELECT * FROM automation_runs ORDER BY id DESC LIMIT 1').fetchone()
                        if last:
                            print(f"**Run:** {last['id']}  ")
                            print(f"**Status:** {last['status']}  ")
                            print(f"**Cases created:** {last['cases_created']}  ")
                            print(f"**Cases updated:** {last['cases_updated']}  ")
                            print(f"**Contacts found:** {last['contacts_found']}  ")
                            print(f"**Drafts created:** {last['drafts_created']}  ")
                            if last['error']:
                                print(f"**Error:** {last['error']}  ")
                        print('')
                        print('## Top approval queue')
                        rows = conn.execute('''
                            SELECT o.status, o.recipient_email, o.subject,
                                   c.detected_company_name, c.contract_ref, c.financial_priority
                            FROM outreach_messages o
                            JOIN cases c ON c.id=o.case_id
                            WHERE o.status IN ('READY_FOR_APPROVAL','NEEDS_CONTACT','APPROVED')
                            ORDER BY c.financial_priority DESC, o.id DESC
                            LIMIT 20
                        ''').fetchall()
                        if not rows:
                            print('No pending prospects in the queue yet.')
                        else:
                            print('| Priority | Company | Contract | Status | Contact |')
                            print('|---:|---|---|---|---|')
                            for row in rows:
                                company = (row['detected_company_name'] or '').replace('|', '/')
                                contract = (row['contract_ref'] or '').replace('|', '/')
                                email = row['recipient_email'] or 'pending'
                                print(f"| {row['financial_priority']} | {company} | {contract} | {row['status']} | {email} |")
                    finally:
                        conn.close()
                    PY

                - name: Upload Case Hunter cloud state
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: case-hunter-cloud-state-${{ github.run_number }}
                    path: |
                      data/case_hunter.db
                      data/last-auto-run.json
                    if-no-files-found: warn
                    retention-days: 30
          YAML

      - name: Update documentation for official repository layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('hace checkout de la rama `case-hunter-resolve`;', 'hace checkout del repositorio oficial `Nicricht/casehunter`;')
          text = text.replace('El workflow se encuentra en la rama por defecto del repositorio como `.github/workflows/case-hunter-auto.yml`', 'El workflow oficial se encuentra en `.github/workflows/case-hunter-auto.yml`')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Verify copied structure
        run: |
          test -f casehunter/webapp.py
          test -f casehunter/auto_service.py
          test -f casehunter/outreach.py
          test -f tests/test_api.py
          test -f tests/test_auto_service.py
          test -f .github/workflows/test.yml
          test -f .github/workflows/case-hunter-auto.yml
          test -f requirements.txt

      - name: Commit migrated project
        run: |
          git config user.name 'Case Hunter Migration'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to migrate.'
            exit 0
          fi
          git commit -m 'feat: migrar Case Hunter v2.2.0 al repositorio oficial'
          git push origin HEAD:main
